<style>
        .grid-bg {
            background-size: 40px 40px;

                linear-gradient(to bottom, rgba(93, 230, 255, 0.05) 1px, transparent 1px);
        }
        .circuit-pulse {
            animation: pulse-glow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 1; filter: drop-shadow(0 0 8px rgba(93,230,255,0.6)); }
            50% { opacity: 0.5; filter: drop-shadow(0 0 2px rgba(93,230,255,0.2)); }
        }
        .neon-box {
            box-shadow: 0 0 15px rgba(93,230,255,0.3);
        }
        .glass-panel {
            background: rgba(6, 14, 32, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .neon-glow-cyan { filter: drop-shadow(0 0 12px rgba(93,230,255,0.8)); }
        .neon-glow-pink { filter: drop-shadow(0 0 12px rgba(255,178,183,0.8)); }

<body class="bg-background text-on-surface min-h-screen overflow-hidden flex flex-col grid-bg relative">
<!-- Ambient Grid Overlay -->
<div class="absolute inset-0 pointer-events-none opacity-20 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-secondary/10 via-background to-background"></div>
<!-- TopAppBar JSON Component -->
<header class="bg-background/80 backdrop-blur-xl fixed top-0 w-full border-b border-white/10 flex justify-between items-center px-container-padding-mobile md:px-container-padding-desktop h-16 w-full z-50">
<div class="flex items-center">
<span class="font-headline-md text-headline-md italic tracking-tighter text-secondary drop-shadow-[0_0_8px_rgba(93,230,255,0.6)]">CIRCUIT_SLIDE</span>
</div>
<div class="flex items-center gap-4">
<button aria-label="Pause" class="text-outline hover:text-primary transition-all duration-300 active:scale-95 transition-transform" data-action="ACT_PAUSE_GAME">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">pause</span>
</button>
<button aria-label="Refresh" class="text-outline hover:text-primary transition-all duration-300 active:scale-95 transition-transform" data-action="ACT_RESTART_GAME">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">refresh</span>
</button>
<button aria-label="Settings" class="text-outline hover:text-primary transition-all duration-300 active:scale-95 transition-transform">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">settings</span>
</button>
</div>
</header>

<main class="flex-1 flex items-center justify-center pt-16 relative z-10 w-full max-w-max-width mx-auto px-container-padding-desktop">

<div class="relative flex items-center justify-center w-full max-w-4xl aspect-square md:aspect-video glass-panel rounded-xl p-8">

<div class="absolute left-0 top-1/2 -translate-y-1/2 -translate-x-1/2 w-16 h-16 rounded-full bg-secondary-container flex items-center justify-center neon-glow-cyan z-20">
<span class="material-symbols-outlined text-background font-bold text-3xl" style="font-variation-settings: 'FILL' 1;">bolt</span>
</div>

<div class="absolute right-0 top-1/2 -translate-y-1/2 translate-x-1/2 w-16 h-16 rounded-full glass-panel border-outline flex items-center justify-center z-20">
<span class="material-symbols-outlined text-outline text-3xl">logout</span>
</div>

</div>

</div>

<div class="md:hidden fixed bottom-4 left-4 right-4 flex justify-between items-end z-40 pointer-events-none">
